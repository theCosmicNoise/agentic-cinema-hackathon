<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEARCUT script clearance</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎬</text></svg>">
</head>
<body>

<header class="topbar">
  <button class="wordmark" id="home" title="Back to your scripts" aria-label="Back to your scripts">CLEAR<span>CUT</span></button>
  <div class="tagline" id="tagline">Script clearance for film &amp; television</div>
  <div class="crumb" id="crumb"></div>
  <div class="health">
    <div class="dot" id="d-gem"><i></i> Gemini</div>
    <div class="dot" id="d-par"><i></i> Parallel</div>
  </div>
</header>

<div class="layout">
  <aside class="rail" id="rail" hidden>
    <div class="label">Clearance pipeline</div>
    <div id="steps"></div>
    <div class="label" style="margin-top:24px">This script</div>
    <div id="meta"></div>
    <button class="btn ghost wide" id="newsess" style="margin-top:14px">Clear a different script</button>
  </aside>

  <main class="main" id="main"></main>
</div>

<script src="/app.js"></script>
</body>
</html>
