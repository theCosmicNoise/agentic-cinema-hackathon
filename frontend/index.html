<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEARCUT — automated script clearance</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎬</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="wordmark">CLEAR<span>CUT</span></div>
  <div class="tagline">Script clearance &amp; rights-risk agent network</div>
  <div class="health">
    <div class="dot" id="d-gem"><i></i> Gemini</div>
    <div class="dot" id="d-par"><i></i> Parallel</div>
  </div>
</header>

<div class="layout">
  <aside class="rail">
    <section id="setup">
      <div class="label">Draft</div>
      <div id="drafts"></div>
      <button class="run" id="start">Open clearance session</button>
    </section>

    <section id="pipeline" hidden>
      <div class="label">Pipeline</div>
      <div id="stages"></div>
    </section>

    <section id="sessmeta" hidden>
      <div class="label">Session</div>
      <div id="meta"></div>
      <button class="ghost" id="newsess">Start over</button>
    </section>
  </aside>

  <main class="main">
    <div class="view" id="stageview">
      <div class="placeholder">
        <div class="big">Open a clearance session</div>
        <div>Six agents run in sequence. You review and approve each one before the next begins.</div>
      </div>
    </div>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
